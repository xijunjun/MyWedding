<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>给特别的你</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f7f2ec;color:#3d332d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .page{max-width:720px;margin:auto;min-height:100vh;background:#fffaf5}
  .hero{width:100%;height:62vh;min-height:420px;object-fit:cover;display:block}
  .content{padding:42px 28px 60px;text-align:center}
  h1{font-size:28px;font-weight:500;letter-spacing:2px;margin:0 0 28px}
  p{font-size:17px;line-height:2.1;margin:0;white-space:pre-line}
  .line{width:42px;height:1px;background:#cdb9a7;margin:28px auto}
  .footer{font-size:13px;color:#a08e80;letter-spacing:1px}
</style>
</head>
<body>
<main class="page">
  <img class="hero" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85" alt="风景">
  <section class="content">
    <h1>给特别的你</h1>
    <p>有些话不一定要说出口，
但我还是想让你知道：

遇见你，
是一件很幸运的事。

希望你以后每一天，
都有值得开心的小事。</p>
    <div class="line"></div>
    <div class="footer">愿所有美好如期而至</div>
  </section>
</main>
</body>
</html>
